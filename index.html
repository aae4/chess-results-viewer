<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Chess Results Viewer — Сайт переехал на chesstown.ru</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #111827;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #1e293b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --btn-text: #ffffff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 14px;
    }
    .btn {
      display: inline-block;
      margin-top: 8px;
      margin-bottom: 16px;
      padding: 12px 24px;
      background: var(--accent);
      color: var(--btn-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .hint {
      font-size: 13px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Chess Results Viewer</div>
    <h1>Сайт переехал на новый адрес</h1>
    <p>
      Старая версия больше не поддерживается и скоро будет полностью отключена.
    </p>
    <p>
      Новая версия проекта теперь работает по адресу <strong>chesstown.ru</strong>:
    </p>
    <a class="btn" href="https://chesstown.ru/">Перейти на chesstown.ru</a>
    <p class="hint">Пожалуйста, обновите закладку в браузере.</p>
  </main>
</body>
</html>
