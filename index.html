<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Chess Results Viewer — Сайт переехал</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #111827;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #1e293b;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 12px;
    }
    p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Chess Results Viewer</div>
    <h1>Сайт переезжает на новый адрес</h1>
    <p>
      Старая версия на GitHub Pages больше не поддерживается и скоро будет полностью отключена.
    </p>
    <p>
      Новая версия проекта уже готовится к запуску — в ближайшие дни здесь появится анонс и ссылка на актуальный адрес сайта.
    </p>
  </main>
</body>
</html>
